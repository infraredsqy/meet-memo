# meeting —— 本地会议录制服务骨架（V2 第一个工程节点）
#
# 依赖禁忌（phase1 §3.2，写进本文件以免下游照抄错）：
#   - 不引 sse-starlette（SSE 手写）
#   - 不引 FastAPI（技术栈是 Starlette + uvicorn）
#   - 不引 pytest-asyncio（测试一律同步写）
#   - 不引 websockets
# 运行时依赖只有 starlette / uvicorn / anyio 三条（anyio 由 meeting/service/routes.py
# 直接 import —— materials 上传的流式写盘，虽是 starlette 的传递依赖也照实声明）；
# 模型依赖一律放 optional extra，
# 保证 `meeting web` 的 import 链不碰重依赖、启动在秒级完成（B11 / E10）。
#
# **音频依赖是例外（`dca4539b` §5 的裁定）**：录音是这个产品的主体（R1），所以
# numpy / sounddevice / soundcard / pydub 进**运行时依赖**，不进 `capture` extra ——
# 放进可选 extra 会让「没装 extra」退化成「一场会什么都没录」，正是 R2 / R4 要消灭的
# 那种静默失败。它们在函数体内惰性 import（`meeting/capture/sources.py`），所以
# `meeting web` 的启动链依旧不 import 声卡库。`ffmpeg` 是外部二进制（README 的前置条件），
# 缺席时转码步骤如实记 `failed` 并保留 PCM。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting"
version = "0.1.0"
description = "本地会议录制服务：单进程、只监听 127.0.0.1"
requires-python = ">=3.13"
dependencies = [
    "starlette",
    "uvicorn",
    # routes.py 直接 import（materials 上传的流式写盘），不靠 starlette 传递
    "anyio",
    # 音频四件套（版本号是本机实测跑通整套采集与归档的那几个，照 `dca4539b` 的验收环境写）
    "numpy==2.4.4",
    "sounddevice==0.5.5",
    "soundcard==0.4.6",
    "pydub==0.25.1",
]

[project.scripts]
meeting = "meeting.cli:main"

[project.optional-dependencies]
# `capture` 这一格**有意留空**（`dca4539b` §5）：音频四件套已经进运行时依赖，
# 这里再列一遍会让人以为它们是可选的。`asr` 等模型依赖由下游节点各自加（§3.2）。
capture = []
# `asr` = 转写（GLM-ASR）的模型依赖（`9e5db89c` phase1 定档）。三个版本号照 V1
# `meeting-notes\requirements.txt` 的本机实测值**逐项按行**写（Python 3.13.7 / CUDA 12.8）：
#   torch 2.9.1+cu128（第 10 行；第 9 行是它要的 `--extra-index-url` 索引）·
#   transformers 5.15.0（第 24 行，GLM-ASR 类由此版进稳定版）·
#   webrtcvad-wheels 2.0.14（第 27 行，原版 webrtcvad 在 Windows/Py3.13 编译不过）。
# **不装这一格照样能起服务**：重依赖全在 `meeting/asr/` 的函数体内惰性 import，
# `import meeting.asr.glm` 一条重依赖都不拉（`tests/test_asr_glm.py` 在全新解释器里盯着这一条）。
# ⚠ `torch==2.9.1+cu128` 是 CUDA 12.8 构建，PyPI 上没有这个 wheel，装的时候要带索引：
#   pip install --extra-index-url https://download.pytorch.org/whl/cu128 "meeting[asr]"
#   （CPU 版写成 `torch==2.9.1`、不用那个索引即可。）
# numpy 不在这里重复列：它是运行时依赖（音频四件套那一格），版本已经钉死。
asr = [
    "torch==2.9.1+cu128",
    "transformers==5.15.0",
    "webrtcvad-wheels==2.0.14",
]
# `post` = 会后离线转写这一层的依赖（`7c6952e5` phase2）。只有 `av` 一条：
# `meeting/offline/audio.py` 用 PyAV 把任意容器解成 16k 单声道 float32 波形 ——
# 走 `transformers.audio_utils.load_audio` 的字符串路径会落到 librosa 上，而本机没装它。
# **有意不加 librosa**：`numba` / `librosa` 与钉死的 numpy 冲突，设计里也一直避开它。
# torch / transformers / webrtcvad 不在这一格重复列：它们已经在 `asr` 那一格里，
# 会后离线路径与会中转写共用同一套模型依赖。**不装这一格照样能起服务**：
# `av` 在函数体内惰性 import，`import meeting.backends.post` 一条重依赖都不拉。
post = [
    "av",
]
# 测试层：httpx 只服务测试层的真服务子进程；运行时的端口探针走标准库 socket。
# pytest-xdist / execnet 服务并行档（`-n auto --dist loadfile` 走命令行，不进 addopts），
# 只进测试 extra（`68927c27` spec 判定 6：运行时依赖零增加）；本机实测
# pytest-xdist 3.8.0 + execnet 2.1.2 与 pytest 9.0.3 兼容（并行趟全绿，下限按它取）。
test = [
    "pytest",
    "httpx",
    "pytest-xdist>=3.6",
    "execnet>=2.1",
]

[tool.setuptools]
# 显式列出包：与目录树一一对应（包标记都必须在位 —— `meeting.capture` 是
# `dca4539b` 建的采集层，漏了它 `pip install` 之后那三个模块就不在包里；
# `meeting.asr` 是 `9e5db89c` phase1 建的转写核心，漏了它 `transcriber.backend = auto`
# 在装好的包里会解析失败；`meeting.offline` 是 `7c6952e5` 建的会后离线层，
# 漏了它 `post.hook = auto`（约定路径 `meeting.backends.post:PostProcessHook`）
# 在装好的包里会解析不到 `meeting.offline.runner`；`meeting.minutes` 是 `41465462`
# 建的会后纪要层，漏了它 `minutes.hook = auto`（约定路径
# `meeting.backends.minutes:MinutesHook`）在装好的包里会解析不到、
# `python -m meeting.minutes` 那三个手动子命令（`check` / `chunk` / `prompt`）
# 也会找不到模块；`meeting.summary` 是 `1987cb20` phase1 建的会中总结内核，
# 漏了它装好的包里 `import meeting.summary` 会直接失败（phase2 的服务接线、phase3 的
# 界面都要经它拿到窗口切片与端点调用那一套）。
packages = [
    "meeting",
    "meeting.service",
    "meeting.backends",
    "meeting.capture",
    "meeting.asr",
    "meeting.offline",
    "meeting.minutes",
    "meeting.summary",
]

[tool.setuptools.package-data]
# debug.html 住在包里：pip install 之后 /debug 那页也得在。
"meeting.service" = ["*.html"]

[tool.pytest.ini_options]
# 测试进程的导入路径定死一条：pythonpath 按 rootdir 解析，
# pyproject.toml 与 tests/ 同在仓库根，从仓库根跑 `python -m pytest` 时 rootdir 落在仓库根，
# 干净检出、未安装包的状态下 `import meeting` 因此成立。
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    # 慢档：起真服务子进程 / 真墙钟等待 / 注入慢模型 / 单条实测 > 2.0s 的用例（文件粒度）。
    # 归位判据、23 个文件与三条命令的实测耗时见 `docs/service.md` 第 7 章「快慢分档」。
    "slow: 需要真子进程或真实墙钟等待；未改动核心代码时可跳过",
]
# `--strict-markers` 管的是代码里 `pytest.mark.xxx` 那一侧：标记名必须已在 markers 里注册，
# 没注册就当场报 unknown mark。命令行的 `-m` 表达式**不参与**这道校验（pytest 9.0.3 实测）：
# `-m sloww` 谁都不带、退出码 5（no tests collected），`-m "not sloww"` 于是恒真、全被选上。
addopts = "--strict-markers"
